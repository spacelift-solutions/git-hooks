name: Spacelift repository checks
description: Run the same repository checks used by the shared local Git hook

inputs:
  working-directory:
    description: Repository directory to scan
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Set up check dependencies
      shell: bash
      run: "${GITHUB_ACTION_PATH}/scripts/setup-tools"

    - name: Run repository checks
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: "${GITHUB_ACTION_PATH}/bin/run-checks repository \"${PWD}\""

branding:
  icon: shield
  color: purple
