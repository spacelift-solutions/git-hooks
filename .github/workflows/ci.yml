name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Spacelift repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint shell scripts
        run: |
          shellcheck \
            bin/run-checks \
            checks/* \
            hooks/* \
            install \
            scripts/* \
            tests/run \
            tests/rules

      - name: Run tests
        run: ./tests/run

      - name: Set up tools
        run: ./scripts/setup-tools

      - name: Test detection rules
        run: ./tests/rules

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Test Go command
        run: go test ./...

      - name: Vet Go command
        run: go vet ./...

      - name: Exercise the shared action
        uses: ./
