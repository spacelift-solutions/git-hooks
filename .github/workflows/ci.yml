name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint shell scripts
        run: |
          shellcheck \
            bin/run-checks \
            checks/* \
            hooks/* \
            install \
            scripts/* \
            tests/run

      - name: Run tests
        run: ./tests/run

      - name: Exercise the shared action
        uses: ./
